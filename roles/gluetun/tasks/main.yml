---
# roles/gluetun/tasks/main.yml
# Deploy Gluetun VPN via Docker Compose (Plex nodes only)

- name: Create Gluetun directory
  ansible.builtin.file:
    path: /opt/gluetun
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Gluetun Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/gluetun/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Check if VPN config exists
  ansible.builtin.stat:
    path: /opt/gluetun/config.conf
  register: vpn_config

- name: Start Gluetun (if config exists)
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/gluetun
  when: vpn_config.stat.exists
  changed_when: true

- name: Display Gluetun setup instructions
  ansible.builtin.debug:
    msg: |
      ┌──────────────────────────────────────────────────────┐
      │  Gluetun VPN deployed at /opt/gluetun                │
      │                                                      │
{% if not vpn_config.stat.exists %}
      │  ⚠️  VPN config not found!                            │
      │  Copy your .ovpn file:                               │
      │    cp your-vpn.ovpn /opt/gluetun/config.conf         │
      │  Then start:                                         │
      │    cd /opt/gluetun && docker compose up -d            │
{% else %}
      │  ✅  VPN config found, Gluetun started.               │
{% endif %}
      │                                                      │
      │  Route containers through VPN:                       │
      │    network_mode: "service:gluetun"                   │
      └──────────────────────────────────────────────────────┘

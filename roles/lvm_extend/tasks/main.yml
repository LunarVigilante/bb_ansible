---
# roles/lvm_extend/tasks/main.yml
# Executes the automated LVM drive discovery and pool extension payload

- name: Deploy automated LVM extension payload
  ansible.builtin.copy:
    src: auto_lvm_extend.sh
    dest: /usr/local/bin/auto_lvm_extend.sh
    mode: "0755"

- name: Execute automated secondary drive discovery and formatting
  ansible.builtin.command: "/usr/local/bin/auto_lvm_extend.sh '{{ lvm_ignore_drives | default('') }}'"
  register: lvm_auto_result
  changed_when: "'Successfully appended' in lvm_auto_result.stdout"
  failed_when: false
  timeout: 60

- name: Display volume expansion results
  ansible.builtin.debug:
    var: lvm_auto_result.stdout_lines

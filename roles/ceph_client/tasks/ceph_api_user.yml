---
# roles/ceph_client/tasks/ceph_api_user.yml
# Create a Ceph user via the Ceph Dashboard REST API and export the keyring

- name: Check if Ceph keyring already exists locally
  ansible.builtin.find:
    paths: /etc/ceph
    patterns: "ceph.client.*.keyring"
  register: ceph_keyring_stat

- name: Extract existing ceph_client_id if keyring exists
  ansible.builtin.set_fact:
    ceph_client_id: "{{ ceph_keyring_stat.files[0].path | regex_replace('^/etc/ceph/ceph\\.client\\.(.*)\\.keyring$', '\\1') }}"
  when: ceph_keyring_stat.matched > 0

- name: Create Ceph user via REST API
  when: ceph_keyring_stat.matched == 0
  block:
    - name: Authenticate to Ceph Dashboard
      ansible.builtin.uri:
        url: "{{ vault_ceph_dashboard_url }}/api/auth"
        method: POST
        headers:
          Content-Type: "application/json"
          Accept: "application/vnd.ceph.api.v1.0+json"
        body_format: json
        body:
          username: "{{ vault_ceph_dashboard_user }}"
          password: "{{ vault_ceph_dashboard_password }}"
        validate_certs: false
        status_code: [200, 201]
      register: ceph_auth
      no_log: true

    - name: Set JWT token fact
      ansible.builtin.set_fact:
        ceph_jwt: "{{ ceph_auth.json.token }}"
      no_log: true

    - name: Create Ceph user (with auto-increment on name collision)
      ansible.builtin.shell: |
        BASE_NAME="{{ node_name }}"
        TARGET_NAME="$BASE_NAME"
        COUNTER=1
        JWT="{{ ceph_jwt }}"
        API="{{ vault_ceph_dashboard_url }}"

        # Build the capabilities JSON
        {% if node_type in ['share', 'appbox'] %}
        OSD_CAP="allow r tag cephfs data=cephfs network {{ node_ip }}/32, allow r tag cephfs data=embyfs network {{ node_ip }}/32, allow r tag cephfs data=plexfs network {{ node_ip }}/32, allow rwx tag cephfs data=bbfs network {{ node_ip }}/32"
        MDS_CAP="allow r fsname=cephfs path=/ network {{ node_ip }}/32, allow r fsname=plexfs path=/ network {{ node_ip }}/32, allow r fsname=embyfs path=/ network {{ node_ip }}/32, allow rw fsname=bbfs path=/blackbeard/{{ node_name }} network {{ node_ip }}/32"
        {% else %}
        OSD_CAP="allow rw tag cephfs data=cephfs network {{ node_ip }}/32, allow r tag cephfs data=embyfs network {{ node_ip }}/32, allow r tag cephfs data=plexfs network {{ node_ip }}/32, allow rwx tag cephfs data=bbfs network {{ node_ip }}/32"
        MDS_CAP="allow r fsname=cephfs path=/ network {{ node_ip }}/32, allow r fsname=plexfs path=/ network {{ node_ip }}/32, allow r fsname=embyfs path=/ network {{ node_ip }}/32, allow rw fsname=bbfs path=/blackbeard network {{ node_ip }}/32"
        {% endif %}
        MON_CAP="allow r fsname=cephfs, allow r fsname=plexfs, allow r fsname=embyfs, allow r fsname=bbfs, allow r network {{ node_ip }}/32"

        CAPS_JSON=$(cat <<EOJSON
        [
          {"entity": "mon", "cap": "${MON_CAP}"},
          {"entity": "osd", "cap": "${OSD_CAP}"},
          {"entity": "mds", "cap": "${MDS_CAP}"}
        ]
        EOJSON
        )

        while [ $COUNTER -le 10 ]; do
            BODY="{\"user_entity\": \"client.${TARGET_NAME}\", \"capabilities\": ${CAPS_JSON}}"

            HTTP_CODE=$(curl -s -o /tmp/ceph_api_response.json -w "%{http_code}" \
                -X POST "${API}/api/cluster/user" \
                -H "Authorization: Bearer ${JWT}" \
                -H "Accept: application/vnd.ceph.api.v1.0+json" \
                -H "Content-Type: application/json" \
                -d "${BODY}" -k)

            if [ "$HTTP_CODE" == "201" ] || [ "$HTTP_CODE" == "200" ]; then
                echo "$TARGET_NAME"
                exit 0
            elif [ "$HTTP_CODE" == "400" ]; then
                DETAIL=$(cat /tmp/ceph_api_response.json)
                if echo "$DETAIL" | grep -q "exists"; then
                    # Name collision — increment and retry
                    COUNTER=$((COUNTER + 1))
                    TARGET_NAME="${BASE_NAME}-v${COUNTER}"
                else
                    echo "API error: $DETAIL" >&2
                    exit 1
                fi
            else
                echo "Unexpected HTTP $HTTP_CODE: $(cat /tmp/ceph_api_response.json)" >&2
                exit 1
            fi
        done

        echo "Exceeded max retries for Ceph user creation" >&2
        exit 1
      register: ceph_user_result
      changed_when: ceph_user_result.rc == 0

    - name: Set Ceph client ID from creation result
      ansible.builtin.set_fact:
        ceph_client_id: "{{ ceph_user_result.stdout }}"

    - name: Export Ceph user keyring
      ansible.builtin.uri:
        url: "{{ vault_ceph_dashboard_url }}/api/cluster/user/export"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ ceph_jwt }}"
          Accept: "application/vnd.ceph.api.v1.0+json"
          Content-Type: "application/json"
        body:
          entities:
            - "client.{{ ceph_client_id }}"
        validate_certs: false
        status_code: [200, 201]
        return_content: true
      register: ceph_keyring_export

    - name: Write Ceph keyring to file
      ansible.builtin.copy:
        content: "{{ ceph_keyring_export.content }}"
        dest: "/etc/ceph/ceph.client.{{ ceph_client_id }}.keyring"
        owner: root
        group: root
        mode: "0600"

  rescue:
    - name: Warn about Ceph user creation failure
      ansible.builtin.debug:
        msg:
          - "⚠ Ceph user creation via Dashboard API failed."
          - "You may need to create the Ceph user manually."
          - "Run 'bb install node' again after fixing the Ceph Dashboard."

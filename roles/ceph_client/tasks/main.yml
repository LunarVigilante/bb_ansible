---
# roles/ceph_client/tasks/main.yml
# Deploy Ceph configuration, create user via REST API, deploy keyring, mount filesystems

- name: Ensure /etc/ceph directory exists
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch ceph.conf from cluster
  ansible.builtin.shell: |
    # Extract host from dashboard URL (https://host:port -> host)
    CEPH_HOST=$(echo "{{ vault_ceph_dashboard_url }}" | sed -E 's|https?://([^:]+).*|\1|')
    ssh -i "{{ vault_ceph_ssh_key }}" -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${CEPH_HOST}" \
      "ceph config generate-minimal-conf" 2>/dev/null
  register: ceph_minimal_conf
  changed_when: false

- name: Deploy Ceph configuration
  ansible.builtin.copy:
    content: "{{ ceph_minimal_conf.stdout }}\n"
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: "0644"

# Create Ceph user and get keyring via Dashboard REST API
- name: Create Ceph user via Dashboard REST API
  ansible.builtin.include_tasks: ceph_api_user.yml

# Mount Ceph filesystems (only if a keyring was created or already exists)
- name: Re-check for Ceph keyring before mounting
  ansible.builtin.find:
    paths: /etc/ceph
    patterns: "ceph.client.*.keyring"
  register: ceph_keyring_final

- name: Configure and mount Ceph filesystems
  ansible.builtin.include_tasks: ceph_mounts.yml
  when: ceph_keyring_final.matched > 0

- name: Skip Ceph mounts (no keyring)
  ansible.builtin.debug:
    msg: "⚠ No Ceph keyring found — skipping filesystem mounts. Create the user manually and re-run."
  when: ceph_keyring_final.matched == 0

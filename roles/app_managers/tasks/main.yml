---
# roles/app_managers/tasks/main.yml
# Deploy Ecosystem Managers (Notifiarr, Tracearr stack, Unpackerr, Autoscan Arrays, Scrutiny, MKVToolNix)

- name: Create base appdata directories for Manager apps
  ansible.builtin.file:
    path: "/opt/appdata/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{
      autoscan_instances | default([]) +
      notifiarr_instances | default([]) +
      unpackerr_instances | default([]) +
      scrutiny_instances | default([]) +
      mkvtoolnix_instances | default([])
    }}
  when: item.name is defined

- name: Create Tracearr directories
  ansible.builtin.file:
    path: "/opt/appdata/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - tracearr
    - tracearr/db
    - tracearr/redis
  when: enable_tracearr | default(false) | bool

- name: Create app_managers compose directory
  ansible.builtin.file:
    path: /opt/compose/app_managers
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy app_managers Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/compose/app_managers/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start app_managers
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: /opt/compose/app_managers
  changed_when: true
